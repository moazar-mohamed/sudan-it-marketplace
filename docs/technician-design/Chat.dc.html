<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>محادثة الشركة — بوابة الفني</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#063b73}a:hover{color:#052b57}
button,input{font-family:inherit}
input::placeholder{color:#5d6f86}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #eef3f9; font-family: 'Cairo', system-ui, sans-serif; color: #12263f; overflow: hidden">

  <header style="flex: none; background: rgba(6,59,115,0.93); box-shadow: 0 8px 22px -14px rgba(0,0,0,0.6); color: #ffffff; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
    <a href="Chats.dc.html" aria-label="رجوع إلى المحادثات" style="flex: none; width: 44px; height: 44px; box-sizing: border-box; border-radius: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22); color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
    </a>
    <span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #ffffff; color: #063b73; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"></path></svg>
    </span>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 16px; font-weight: 800; line-height: 1.35">سودان برنت هب</h1>
      <p style="margin: 0; font-size: 12px; color: #c3d2e4">محادثة مهمة <span dir="ltr">#7K2Q</span></p>
    </div>
  </header>

  <a href="JobDetails.dc.html" style="flex: none; text-decoration: none; color: #12263f; background: #ffffff; border-bottom: 1px solid #dde5ef; padding: 10px 16px; display: flex; align-items: center; gap: 10px">
    <span style="flex: none; width: 36px; height: 36px; border-radius: 10px; background: #e8f0fa; color: #063b73; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"></path><path d="M3 8l9 5 9-5M12 13v8"></path></svg>
    </span>
    <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">طابعة HP LaserJet Pro M404dn · أحمد عثمان</span>
    <span style="flex: none; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #e8f0fa; color: #063b73">قيد التجهيز</span>
  </a>

  <main aria-label="الرسائل" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 8px">
    <p style="align-self: center; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: #5d6f86; background: #ffffff; border-radius: 999px; padding: 4px 12px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      بينك وبين الشركة فقط، العميل لا يراها
    </p>
    <p style="align-self: center; margin: 4px 0; font-size: 12px; font-weight: 700; color: #5d6f86">اليوم</p>

    <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
      <div style="max-width: 80%; align-self: {{m.side}}; background: {{m.bg}}; color: {{m.fg}}; border-radius: {{m.radius}}; padding: 8px 12px 6px; box-shadow: 0 1px 1px rgba(11,29,58,0.06)">
        <div style="font-size: 15px; line-height: 1.6">{{m.text}}</div>
        <div style="font-size: 12px; opacity: 0.75; margin-top: 2px; text-align: left">{{m.time}}</div>
      </div>
    </sc-for>
  </main>

  <div role="group" aria-label="ردود سريعة" style="flex: none; display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto">
    <button style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dde5ef; background: #ffffff; color: #063b73; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">وصلت للعميل</button>
    <button style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dde5ef; background: #ffffff; color: #063b73; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">العميل لا يرد</button>
    <button style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #dde5ef; background: #ffffff; color: #063b73; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">أحتاج قطعة إضافية</button>
  </div>

  <form style="flex: none; background: #ffffff; border-top: 1px solid #dde5ef; padding: 10px 12px 14px; display: flex; align-items: center; gap: 8px; margin: 0">
    <label for="chat-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">رسالة للشركة</label>
    <input id="chat-input" type="text" placeholder="اكتب رسالة" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; border: 1px solid #dde5ef; background: #eef3f9; border-radius: 24px; padding: 0 16px; font-size: 15px; color: #12263f; outline: none">
    <button type="button" aria-label="إرسال" style="flex: none; width: 48px; height: 48px; border-radius: 24px; border: 0; background: #1fa35c; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5m0 0 6-6m-6 6 6 6"></path></svg>
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const company = { side: 'flex-start', bg: '#ffffff', fg: '#12263f', radius: '16px 4px 16px 16px' };
    const me = { side: 'flex-end', bg: '#063b73', fg: '#ffffff', radius: '4px 16px 16px 16px' };
    return {
      messages: [
        { ...company, text: 'صباح الخير يا محمد، الطابعة جاهزة في المخزن. استلمها قبل الساعة 12.', time: '10:12' },
        { ...me, text: 'تمام، أنا في الطريق للمخزن. الكيبل معها؟', time: '10:20' },
        { ...company, text: 'الكيبل جاهز في المخزن، استلمه قبل ما تطلع. العميل طلب الحضور بعد العصر.', time: '10:22' },
        { ...me, text: 'استلمت الطابعة والكيبل، حأبدأ التوصيل بعد الساعة 3.', time: '11:05' }
      ]
    };
  }
}
</script>
</body>
</html>
