<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>المحادثات — بوابة الفني</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#063b73}a:hover{color:#052b57}
button,input{font-family:inherit}
input::placeholder{color:#5d6f86}
:focus-visible{outline:3px solid #1fa35c;outline-offset:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.card{background:#ffffff;border:1px solid #dde5ef;border-radius:18px;box-shadow:0 1px 2px rgba(11,29,58,.06),0 8px 24px -12px rgba(11,29,58,.15)}
.st{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{background:#e8f5e9;color:#1b5e20}.st.warn{background:#fff4e0;color:#8a5100}.st.info{background:rgba(6,59,115,.12);color:#063b73}.st.go{background:rgba(31,163,92,.16);color:#14532d}
.bar{background:rgba(6,59,115,.93);color:#ffffff;box-shadow:0 8px 22px -14px rgba(0,0,0,.6)}
.ib{position:relative;flex:none;width:44px;height:44px;box-sizing:border-box;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#ffffff;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.ib:hover{color:#ffffff}
.cnt{position:absolute;top:-6px;left:-6px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#1fa35c;color:#ffffff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
.tabs{flex:none;height:72px;background:#ffffff;border-top:1px solid #dde5ef;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:0 6px}
.tab{text-decoration:none;color:#5d6f86;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab .pill{position:relative;width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.tab.on{color:#063b73;font-weight:800}.tab.on .pill{background:#e8f0fa}
.dot{position:absolute;top:-2px;left:8px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:#1fa35c;color:#ffffff;font-size:12px;font-weight:700;line-height:18px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f7fb; font-family: 'Cairo', system-ui, sans-serif; color: #12263f; overflow: hidden">

  <header class="bar" style="flex: none; height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 10px">
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 19px; font-weight: 800; line-height: 1.35">المحادثات</h1>
      <p style="margin: 0; font-size: 12px; opacity: 0.8">محادثة لكل مهمة، بينك وبين الشركة</p>
    </div>
    <a class="ib" href="Notifications.dc.html" aria-label="الإشعارات، 3 جديدة">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
      <span class="cnt">3</span>
    </a>
  </header>

  <div style="flex: none; padding: 12px 16px 4px">
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border: 1px solid #dde5ef; border-radius: 12px; background: #ffffff; color: #5d6f86">
      <svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span class="sr">بحث في المحادثات</span>
      <input type="search" placeholder="ابحث بالمنتج أو العميل أو رقم المهمة" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 15px; color: #12263f">
    </label>
  </div>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="4">
      <a href="Chat.dc.html" class="card" style="text-decoration: none; color: #12263f; padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: {{c.bg}}">
        <span style="flex: none; width: 48px; height: 48px; border-radius: 24px; background: #063b73; color: #ffffff; display: flex; align-items: center; justify-content: center">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"></path></svg>
        </span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="display: flex; align-items: center; gap: 6px">
            <span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.title}}</span>
            <span style="margin-inline-start: auto; flex: none; font-size: 12px; color: {{c.timeFg}}; font-weight: {{c.timeWeight}}">{{c.time}}</span>
          </span>
          <span style="display: flex; align-items: center; gap: 6px">
            <span style="flex: 1; min-width: 0; font-size: 14px; color: {{c.msgFg}}; font-weight: {{c.msgWeight}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.last}}</span>
            <sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{false}}">
              <span style="flex: none; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #1fa35c; color: #ffffff; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center">{{c.unread}}</span>
            </sc-if>
          </span>
          <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
            <span dir="ltr" style="font-size: 12px; color: #5d6f86">{{c.id}}</span>
            <span class="st {{c.tone}}">{{c.status}}</span>
          </span>
        </span>
      </a>
    </sc-for>
  </main>

  <nav class="tabs" aria-label="التنقل الرئيسي">
    <a class="tab" href="Main.dc.html">
      <span class="pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>
      الرئيسية
    </a>
    <a class="tab" href="Jobs.dc.html" aria-label="المهام، مهمة جديدة واحدة">
      <span class="pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"></path></svg><span class="dot">1</span></span>
      المهام
    </a>
    <a class="tab on" href="Chats.dc.html" aria-current="page" aria-label="المحادثات، رسالتان جديدتان">
      <span class="pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg><span class="dot">2</span></span>
      المحادثات
    </a>
    <a class="tab" href="Profile.dc.html">
      <span class="pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
      حسابي
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const unread = { bg: '#f2f7fd', timeFg: '#1fa35c', timeWeight: '800', msgFg: '#12263f', msgWeight: '700', hasUnread: true };
    const read = { bg: '#ffffff', timeFg: '#5d6f86', timeWeight: '600', msgFg: '#5d6f86', msgWeight: '400', hasUnread: false };
    return {
      chats: [
        { ...unread, unread: '1', title: 'طابعة HP · أحمد عثمان', last: 'الشركة: الكيبل جاهز في المخزن، استلمه قبل ما تطلع', time: '10:22', id: '#7K2Q', status: 'قيد التجهيز', tone: 'info' },
        { ...unread, unread: '1', title: 'كاميرات Hikvision · مكتبة النيل', last: 'الشركة: العميل يفضّل الحضور قبل الساعة 2', time: '09:05', id: '#Q9MD', status: 'في الطريق', tone: 'go' },
        { ...read, unread: '', title: 'راوتر TP-Link · سارة إبراهيم', last: 'أنت: في انتظار تأكيد الدفع من طرفكم', time: 'أمس', id: '#B21C', status: 'بانتظار الدفع', tone: 'warn' },
        { ...read, unread: '', title: 'شاشة Samsung · عمر الطيب', last: 'الشركة: شكرًا، العميل راضٍ عن التركيب', time: '8 نوفمبر', id: '#M4TR', status: 'مكتملة', tone: 'ok' }
      ]
    };
  }
}
</script>
</body>
</html>
