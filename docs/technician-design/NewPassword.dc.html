<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>كلمة المرور — بوابة الفني</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#063b73}a:hover{color:#052b57}
button,input{font-family:inherit}
:focus-visible{outline:3px solid #1fa35c;outline-offset:2px}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;border:0;background:#1fa35c;color:#ffffff;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}
.btn:hover{color:#ffffff;filter:brightness(1.08)}
.bar{background:rgba(6,59,115,.93);color:#ffffff;box-shadow:0 8px 22px -14px rgba(0,0,0,.6)}
.ib{position:relative;flex:none;width:44px;height:44px;box-sizing:border-box;border-radius:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);color:#ffffff;display:flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer}
.ib:hover{color:#ffffff}
.hero{position:relative;color:#ffffff;background:radial-gradient(900px 360px at 90% -30%,rgba(52,211,192,.4),transparent),linear-gradient(135deg,#052b57,#0a5f86 62%,#0f8f7d)}
.hero::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
.hero>*{position:relative;z-index:1}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:14px;font-weight:700}
.box{display:flex;align-items:center;height:50px;box-sizing:border-box;border:1px solid #dde5ef;background:#eef3f9;border-radius:12px;padding:0 4px}
.box input{flex:1;min-width:0;height:44px;border:0;padding:0 10px;font-size:15px;color:#12263f;outline:none;background:transparent}
.eye{flex:none;width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#5d6f86;display:flex;align-items:center;justify-content:center;cursor:pointer}
.card{background:#ffffff;border:1px solid #dde5ef;border-radius:20px;box-shadow:0 2px 4px rgba(11,29,58,.08),0 18px 36px -14px rgba(11,29,58,.25)}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #f4f7fb; font-family: 'Cairo', system-ui, sans-serif; color: #12263f; overflow: hidden">

  <sc-if value="{{isFirst}}" hint-placeholder-val="{{true}}">
    <section class="hero" style="flex: none; padding: 40px 24px 76px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
      <img src="/_blob/54f351d29a27bfe8211c45aebbb059f4" alt="Sudan ICT Marketplace" style="width: 64px; height: 64px; padding: 3px; box-sizing: border-box; border-radius: 16px; background: #ffffff; object-fit: contain">
      <h1 style="margin: 6px 0 0; font-size: 23px; font-weight: 800">أهلاً بك يا محمد</h1>
      <p style="margin: 0; font-size: 15px; opacity: 0.88; max-width: 300px">قبل البدء، اختر كلمة مرور خاصة بك بدل المؤقتة التي أرسلتها شركتك</p>
    </section>
  </sc-if>
  <sc-if value="{{isChange}}" hint-placeholder-val="{{false}}">
    <header class="bar" style="flex: none; height: 64px; padding: 0 12px; display: flex; align-items: center; gap: 10px">
      <a class="ib" href="Profile.dc.html" aria-label="رجوع إلى حسابي">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
      </a>
      <h1 style="flex: 1; margin: 0; font-size: 18px; font-weight: 800">تغيير كلمة المرور</h1>
    </header>
  </sc-if>

  <main style="flex: 1; min-height: 0; padding: 0 20px 20px; margin-top: {{lift}}; position: relative; z-index: 1; display: flex; flex-direction: column; gap: 14px">
    <form class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px; margin: 0">
      <sc-if value="{{isChange}}" hint-placeholder-val="{{false}}">
        <div class="fld">
          <label for="pw-old">كلمة المرور الحالية</label>
          <div class="box"><input id="pw-old" type="password" autocomplete="current-password"></div>
        </div>
      </sc-if>
      <div class="fld">
        <label for="pw-new">كلمة المرور الجديدة</label>
        <div class="box">
          <input id="pw-new" type="password" autocomplete="new-password" value="sudan2026">
          <button type="button" class="eye" aria-label="إظهار كلمة المرور"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </div>
      </div>
      <div class="fld">
        <label for="pw-again">أعد كتابتها</label>
        <div class="box"><input id="pw-again" type="password" autocomplete="new-password" value="sudan2026"></div>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px">
        <li style="display: flex; align-items: center; gap: 8px; color: #1b5e20"><svg class="ico sm" style="stroke-width: 2.4" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>6 أحرف على الأقل</li>
        <li style="display: flex; align-items: center; gap: 8px; color: #1b5e20"><svg class="ico sm" style="stroke-width: 2.4" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>الكلمتان متطابقتان</li>      </ul>
      <a class="btn" href="{{doneHref}}">{{saveLabel}}</a>
    </form>
    <p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: #5d6f86; line-height: 1.6">
      <svg class="ico sm" style="margin-top: 2px" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      لا تشارك كلمة المرور مع أحد، ولا حتى مع الشركة.
    </p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"first","options":["first","change"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const first = (this.props.mode ?? 'first') === 'first';
    return {
      isFirst: first,
      isChange: !first,
      lift: first ? '-52px' : '20px',
      saveLabel: first ? 'حفظ والمتابعة' : 'حفظ كلمة المرور',
      doneHref: first ? 'Main.dc.html' : 'Profile.dc.html'
    };
  }
}
</script>
</body>
</html>
