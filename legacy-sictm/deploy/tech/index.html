html,body{margin:0}
body{font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6;color:var(--tx);background:var(--bg)}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column}

/* top bars */

.av{width:50px;height:50px;border-radius:50%;background:var(--lb);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.kv div{background:var(--field);border-radius:12px;padding:10px 14px}
.kv span{display:block;font-size:13px;color:var(--mu)}.kv b{font-weight:800}
.note{background:var(--field);border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;gap:10px}
.note button{width:44px;height:44px;display:grid;place-items:center;color:var(--mu);flex:none;margin:-6px}
.note svg.i{width:18px;height:18px}
.nin{background:var(--field);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:flex-end}
.nin textarea{flex:1;border:0;outline:0;background:none;resize:none;min-height:60px}
.dock{position:sticky;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--bd);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 18px var(--sh)}
.dock .hint{text-align:center;font-size:13px;color:var(--mu);margin-top:8px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}

.ov{position:fixed;inset:0;z-index:50;background:rgba(10,20,36,.55);display:flex;align-items:flex-end;justify-content:center;animation:fd .18s}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto;animation:up .22s}
.sheet:before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--bd);margin:0 auto 14px}

.tbl{background:var(--field);border-radius:14px;padding:4px 14px;margin:14px 0}
.tbl div{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd)}.tbl div:last-child{border:0}
.tbl span{color:var(--mu);width:64px;flex:none}.tbl b{flex:1}
.ck{display:flex;align-items:center;gap:12px;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;min-height:56px;cursor:pointer}

.ck input:checked{background:var(--green);border-color:var(--green)}
.ck input:checked:after{content:"";width:12px;height:6px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-1px)}
.ck:has(input:checked){border-color:var(--green);background:color-mix(in srgb,var(--green) 9%,var(--card))}

label.fl{display:block;font-weight:700;margin:14px 0 8px}
.pw{position:relative}.pw button{position:absolute;inset-inline-end:4px;top:4px;width:44px;height:44px;display:grid;place-items:center;color:var(--mu)}

/* chat */
.strip{background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:10px}
.msgs{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--field)}
.day{align-self:center;font-size:13px;font-weight:700;color:var(--mu);margin:6px 0}
.priv{align-self:center;background:var(--card);border-radius:999px;padding:5px 14px;font-size:13px;color:var(--mu);display:flex;gap:6px;align-items:center}

.bub{max-width:82%;padding:10px 14px;border-radius:16px;background:var(--card);align-self:flex-start;box-shadow:0 1px 0 var(--edge);white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff}

/* notifications / account */
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none;margin-top:8px}

.sw{appearance:none;-webkit-appearance:none;width:56px;height:32px;border-radius:16px;background:#b4bfcd;background:color-mix(in srgb,var(--mu) 40%,transparent);position:relative;cursor:pointer;flex:none;margin:6px 0;transition:.15s}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}

.seg{display:flex;background:var(--field);border-radius:12px;padding:3px}

.seg .on{background:var(--card);color:var(--tx);box-shadow:0 1px 3px var(--sh),0 0 0 1px var(--bd)}
.hr{border-top:1px solid var(--bd);margin:10px 0}
.acct{padding:22px 20px 84px;display:flex;align-items:center;gap:14px}

.two{display:grid;grid-template-columns:1fr 1fr}.two>div{padding:2px 8px}.two>div+div{border-inline-start:1px solid var(--bd)}
.two b{display:block;font-size:22px;font-weight:800;color:var(--acc)}.two .g{color:var(--green)}
/* auth */
.auth{padding:34px 20px 110px;text-align:center}
.auth .logo{width:104px;height:104px;border-radius:26px;margin:0 auto 14px;box-shadow:0 12px 24px rgba(0,0,0,.25)}
.auth h1{font-size:28px;font-weight:800;margin:8px 0 2px}

.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);z-index:99;background:#12263f;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;max-width:88vw;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3)}

.load{flex:1;display:grid;place-items:center;color:var(--mu)}

   Add ?demo to the address to preview every screen with sample data (nothing is saved).
   ============================================================================ */
const FIREBASE_CONFIG={apiKey:"AIzaSyCadbl5AFYPo3CET4gHMhFJ6vDngClJlgM",authDomain:"sictm-website.firebaseapp.com",projectId:"sictm-website",storageBucket:"sictm-website.firebasestorage.app",messagingSenderId:"1081658633550",appId:"1:1081658633550:web:54b31402ee1c51ffb2421f"};

const DEMO=new URLSearchParams(location.search).has("demo");

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const num=n=>Number(n||0).toLocaleString("en-US");
const sdg=n=>`<span class="ltr">${num(n)} SDG</span>`;

const active=o=>["prep","onway","pay"].includes(stateOf(o));
const nm=i=>lang==="en"&&i.nameEn?i.nameEn:i.name;
function title(o){const l=(o.items||[]).filter(i=>i.inst),a=l.length?l:(o.items||[]);if(!a.length)return L("مهمة تركيب","Installation job");return nm(a[0])+(a[0].qty>1?` (${a[0].qty})`:"")+(a.length>1?` +${a.length-1}`:"")}

function dist(o){if(o._dist!=null)return o._dist;const s=o.ship||{};if(!S.geo||s.lat==null||s.lng==null)return null;
const r=x=>x*Math.PI/180,a=Math.sin(r(s.lat-S.geo.lat)/2)**2+Math.cos(r(S.geo.lat))*Math.cos(r(s.lat))*Math.sin(r(s.lng-S.geo.lng)/2)**2;return 12742*Math.asin(Math.sqrt(a))}

const MON=[["يناير","Jan"],["فبراير","Feb"],["مارس","Mar"],["أبريل","Apr"],["مايو","May"],["يونيو","Jun"],["يوليو","Jul"],["أغسطس","Aug"],["سبتمبر","Sep"],["أكتوبر","Oct"],["نوفمبر","Nov"],["ديسمبر","Dec"]];
const p2=n=>String(n).padStart(2,"0"),hm=t=>{const d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())};
const dm=t=>{const d=new Date(t);return d.getDate()+" "+L(...MON[d.getMonth()])};
const day0=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const daysAgo=t=>Math.round((day0(Date.now())-day0(t))/864e5);
const hasTime=s=>/T\d/.test(String(s||""));
function when(t,raw){const d=daysAgo(t);if(d<=0)return hasTime(raw??"T0")?hm(t):L("اليوم","Today");if(d===1)return L("أمس","Yesterday");return dm(t)}
function rel(t){const m=Math.floor((Date.now()-t)/6e4);if(m<1)return L("الآن","now");if(m<60)return L(m===1?"قبل دقيقة":m===2?"قبل دقيقتين":m<11?`قبل ${m} دقائق`:`قبل ${m} دقيقة`,`${m} min ago`);
const h=Math.floor(m/60);if(daysAgo(t)===0)return L(h===1?"قبل ساعة":h===2?"قبل ساعتين":h<11?`قبل ${h} ساعات`:`قبل ${h} ساعة`,`${h} h ago`);return when(t)}
function arrived(o){const j=job(o),raw=j.assignedAt||o.date,t=tsOf(o),d=daysAgo(t);
return d<=0?L("وصلت اليوم","Arrived today")+(hasTime(raw)?" "+hm(t):""):d===1?L("وصلت أمس","Arrived yesterday"):d===2?L("وصلت منذ يومين","Arrived 2 days ago"):L(d<11?`وصلت منذ ${d} أيام`:`وصلت منذ ${d} يوماً`,`Arrived ${d} days ago`)}
const paid=o=>stateOf(o)==="pay"?L("بانتظار تأكيد الدفع","awaiting payment"):L("الدفع مؤكد","payment confirmed");

h=`<h2 style="font-size:22px">${L("إنهاء المهمة","Finish job")} <span class="ltr">${code(o)}</span></h2><div class="mu">${esc(title(o))} · ${esc(cust(o))}</div>
<div class="row" style="margin:14px 0"><div class="prog"><i id="fp" style="width:0"></i></div><span class="b mu sm" id="fn">0 ${L("من","of")} 3</span></div>
<p class="lbl">${L("قبل التأكيد، علّم الخطوات الثلاث","Before confirming, tick the three steps")}</p>${CK.map((t,i)=>`<label class="ck"><input type="checkbox" onchange="S.sheet.ck[${i}]=this.checked;finChk()"><span>${t}</span></label>`).join("")}
<label class="fl mu" for="fx">${L("ملاحظة للشركة (اختيارية)","Note for the company (optional)")}</label><textarea class="f" id="fx" maxlength="500" placeholder="${L("مثلاً: العميل يحتاج حبرًا إضافيًا خلال أسبوع","e.g. the customer will need extra toner within a week")}" oninput="$('fc').textContent=this.value.length"></textarea><div class="mu sm ltr" style="text-align:end;display:block"><span id="fc">0</span> / 500</div>
<div class="row" style="margin-top:10px"><button class="btn s a" style="min-width:110px" onclick="closeSheet()">${L("إلغاء","Cancel")}</button><button class="btn" id="fb" disabled onclick="finishJob('${o.id}')">${I("check")} ${L("تأكيد الإنجاز","Confirm completion")}</button></div>
<div class="hint mu sm" style="text-align:center;margin-top:10px">${L("بعد التأكيد يصل الشركة إشعار، ولا يمكن التراجع.","After confirming, the company is notified and it can't be undone.")}</div>`}
if(s.k==="edit")h=`<h2 style="font-size:22px">${L("تعديل بياناتي","Edit my details")}</h2><label class="fl" for="en">${L("الاسم","Name")}</label><input class="f" id="en" maxlength="60" value="${esc(S.tech.name)}"><label class="fl" for="ep">${L("رقم الهاتف","Phone")}</label><input class="f" id="ep" dir="ltr" inputmode="tel" maxlength="20" value="${esc(S.tech.phone||"")}">
<p class="mu sm">${L("البريد الإلكتروني تغيّره شركتك فقط.","Only your company can change your email.")}</p><div class="row" style="margin-top:10px"><button class="btn s a" style="min-width:110px" onclick="closeSheet()">${L("إلغاء","Cancel")}</button><button class="btn" onclick="saveMe()">${L("حفظ","Save")}</button></div>`;
if(s.k==="ios")h=`<h2 style="font-size:22px">${L("ثبّت الصفحة","Install the page")}</h2><ol style="padding-inline-start:20px;line-height:2.2"><li>${L("اضغط زر المشاركة أو قائمة المتصفح (⋮)","Tap the Share button or the browser menu (⋮)")}</li><li>${L("اختر «إضافة إلى الشاشة الرئيسية»","Choose “Add to Home Screen”")}</li><li>${L("افتح الصفحة من الأيقونة الجديدة","Open the page from the new icon")}</li></ol><button class="btn s" onclick="closeSheet()">${L("حسناً","OK")}</button>`;
return h?`<div class="ov" onclick="if(event.target===this)closeSheet()"><div class="sheet" role="dialog" aria-modal="true">${h}</div></div>`:""}

/* ---------- actions ---------- */
function eye(id){const e=$(id);if(e)e.type=e.type==="password"?"text":"password"}
function login(){const e=$("le").value.trim(),p=$("lp").value;if(!e||!p)return;if(DEMO)return go("home");if(!FB)return toast(L("لا يوجد اتصال","No connection"));S.err="";S.busy=true;render();
FB.au.signInWithEmailAndPassword(FB.auth,e,p).then(()=>{S.busy=false;go("home")}).catch(x=>{S.busy=false;S.err=emsg(x);render()})}
function forgot(){const e=$("le").value.trim();if(!e)return toast(L("اكتب بريدك الإلكتروني أولاً","Enter your email first"));if(!FB)return;
FB.au.sendPasswordResetEmail(FB.auth,e).then(()=>toast(L("أرسلنا رابط تغيير كلمة المرور إلى بريدك","We emailed you a password reset link"))).catch(fail)}
function pwChk(){const a=$("p1").value,b=$("p2").value,o1=a.length>=6,o2=!!a&&a===b;$("r1").className="rule"+(o1?" ok":"");$("r2").className="rule"+(o2?" ok":"");$("pb").disabled=!(o1&&o2&&(!$("p0")||$("p0").value))}
async function savePw(first){const p=$("p1").value;if(DEMO){toast(L("تم الحفظ (عرض تجريبي)","Saved (demo)"));return go(first?"home":"account")}
try{$("pb").disabled=true;if(!first)await FB.au.reauthenticateWithCredential(FB.auth.currentUser,FB.au.EmailAuthProvider.credential(FB.auth.currentUser.email,$("p0").value));
await FB.au.updatePassword(FB.auth.currentUser,p);if(first)api.tech({pwSet:true});toast(L("تم حفظ كلمة المرور","Password saved"));go(first?"home":"account")}catch(e){fail(e)}}
function logout(){if(!confirm(L("تسجيل الخروج من بوابة الفني؟","Sign out of the technician portal?")))return;if(DEMO)return location.href=location.pathname;FB.au.signOut(FB.auth);location.hash=""}
function startJob(id){S.sheet=null;api.job(id,{onWayAt:new Date().toISOString()});toast(L("تم — حالتك الآن «في الطريق»","Done — you're now “On the way”"))}
function finChk(){const n=S.sheet.ck.filter(Boolean).length;$("fp").style.width=n/3*100+"%";$("fn").textContent=`${n} ${L("من","of")} 3`;$("fb").disabled=n<3}
function finishJob(id){const o=T(id),note=$("fx").value.trim(),at=new Date().toISOString();S.sheet=null;
api.msg(id,"✅ "+L("تم إنهاء المهمة","Job finished")+" "+code(o)+(note?"\n"+note:""));
api.job(id,{status:"done",doneAt:at,doneBy:"tech",...(job(o).onWayAt||pickup(o)?{}:{onWayAt:at})});go("done",id)}
function addNote(id){const t=$("ni").value.trim();if(!t)return;$("ni").value="";api.note(id,t)}
function delNote(id){if(confirm(L("حذف هذه الملاحظة؟","Delete this note?")))api.delNote(id)}
function sendMsg(id,t){t=(t||$("mi").value).trim();if(!t)return;if($("mi"))$("mi").value="";api.msg(id,t);setTimeout(()=>scrollTo(0,1e6),30)}
function copyAddr(id){const t=addr(T(id));(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(L("تم نسخ العنوان","Address copied"))).catch(()=>toast(t))}
function sortT(){if(S.sort==="near"&&S.geo){S.sort="new"}else{S.sort="near";if(!S.geo){if(hasGeoTasks())geo(1);else{S.sort="new";toast(L("لا توجد مواقع محددة للعملاء لترتيب الأقرب","Customers have no pinned locations to sort by distance"))}}}sv("sort",S.sort);render(1)}
function geo(ask){if(DEMO||!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{S.geo={lat:p.coords.latitude,lng:p.coords.longitude};sv("geoOk",1);render(1)},()=>{if(ask)toast(L("تعذّر تحديد موقعك. اسمح للصفحة باستخدام الموقع.","Couldn't get your location. Allow location access for this page."))},{maximumAge:6e4,timeout:1e4})}
function openN(id){const n=notifs().find(x=>x.id===id);if(!n)return;go(n.chat?"chat":"task",n.oid)}
function readAll(){S.seenAt=Date.now();S.readN=[];if(!DEMO){sv("seenAt",S.seenAt);sv("readN",[])}render(1)}
async function askN(){if(!("Notification"in window))return toast(L("هذا المتصفح لا يدعم الإشعارات","This browser doesn't support notifications"));const r=await Notification.requestPermission();if(r==="granted")toast(L("تم تفعيل الإشعارات","Notifications enabled"));render(1)}
async function pref(k,v){if(v&&"Notification"in window&&Notification.permission!=="granted"){await askN();if(Notification.permission!=="granted")return render(1)}S.prefs[k]=v;sv("prefs",S.prefs);render(1)}
function saveMe(){const n=$("en").value.trim(),p=$("ep").value.trim();if(!n)return toast(L("اكتب الاسم","Enter your name"));S.sheet=null;api.tech({name:n,phone:p});toast(L("تم الحفظ","Saved"))}
function install(){if(installEvt){installEvt.prompt();installEvt=null}else sheet("ios")}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e});
addEventListener("online",()=>{S.online=true;render(1)});addEventListener("offline",()=>{S.online=false;render(1)});

/* ---------- render ---------- */
function render(keep){const app=$("app");let h;
if(!S.ready)h=`<div class="load">…</div>`;
else if(!S.user||!S.tech)h=vLogin();
else if(S.tech.pwSet===false&&!DEMO)h=vFirst();
else h=({home:vHome,tasks:vTasks,task:vTask,done:vDone,chats:vChats,chat:vChat,notifs:vNotifs,account:vAccount,pw:vPw,first:vFirst,login:vLogin}[S.view]||vHome)();
const a=document.activeElement,id=a&&a.id&&app.contains(a)?a.id:"",st=id?[a.value,a.selectionStart,a.selectionEnd]:0,y=scrollY,keepV=[...app.querySelectorAll("input[id],textarea[id]")].map(e=>[e.id,e.value,e.type]);
app.innerHTML=(DEMO?`<div class="demo">${L("عرض تجريبي · بيانات غير حقيقية","Demo preview · sample data")}</div>`:"")+h+(S.sheet?vSheet():"");
keepV.forEach(([i,v])=>{const e=$(i);if(e&&v&&!e.value)e.value=v});
if(id){const n=$(id);if(n){n.focus({preventScroll:true});try{n.setSelectionRange(st[1],st[2])}catch(e){}}}
if($("p1")&&$("p1").value)pwChk();
if(keep)scrollTo(0,y)}

/* ---------- start ---------- */
document.documentElement.dataset.theme=theme;setLang(lang);
if(DEMO){demo();route()}else{route();fbInit();if(ls("geoOk",0))geo()}
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("/sw.js").catch(()=>{});
</script>
</body>
</html>
