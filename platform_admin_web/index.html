<!doctype html>
<html lang="en" dir="ltr" data-ui="v2">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Old addresses open the same page on the new domain.
      (function () {
        var h = location.hostname;
        if (h === 'sudan-it-marketplace.web.app' || h === 'sudan-it-marketplace.firebaseapp.com') {
          location.replace('https://admin.sictm.net' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231565C0'/%3E%3Cpath d='M8 13h16l-1.5-5h-13zM9 14v9h14v-9' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <!-- Added to an iPhone's Home Screen, the panel opens on its own and can receive notifications. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Platform Admin" />
    <title>Sudan ICT Marketplace - Platform Admin</title>
    <script>
      // Apply a saved light/dark choice before the first paint (no flash).
      try {
        var theme = localStorage.getItem('platform_admin_theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
      // The panel has one look (its styles sit under data-ui="v2", set above); only the density is a saved choice.
      try {
        if (localStorage.getItem('platform_admin_density') === 'compact') document.documentElement.setAttribute('data-density', 'compact');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
