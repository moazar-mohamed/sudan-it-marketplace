<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#12263f;--mu:#5d6f86;--pr:#063b73;--ac:#1fa35c;--bd:#dde5ef;--wa:#e8f0fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1523;--card:#13233a;--tx:#e6eef9;--mu:#93a7c2;--pr:#4a90e2;--bd:#25395a;--wa:#182c48}}
:root[data-theme="dark"]{--bg:#0b1523;--card:#13233a;--tx:#e6eef9;--mu:#93a7c2;--pr:#4a90e2;--bd:#25395a;--wa:#182c48}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#063b73;z-index:10}
header{background:#063b73;color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:auto;padding:8px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center}.logo small{display:block;font-weight:400;font-size:.7rem;opacity:.8}
nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
nav a{color:#fff;opacity:.85;cursor:pointer;padding:6px 12px;border-radius:10px}nav a:hover{background:#ffffff22;opacity:1}
.ua{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.btn{cursor:pointer;border:0;font:inherit;border-radius:10px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:700}
.btn.s{background:var(--wa);color:var(--pr)}.btn.d{background:#d64545}.btn.sm{padding:4px 10px;font-size:.85rem}.btn.w{width:100%}
main{max-width:1100px;margin:auto;padding:16px}
.hero{background:linear-gradient(135deg,#063b73,#0d6b8a);color:#fff;border-radius:20px;padding:34px 22px;margin-bottom:18px}
.hero h1{margin:0 0 8px;font-size:clamp(1.5rem,5vw,2.3rem)}.hero p{opacity:.9;margin:0 0 14px}
.sr{display:flex;gap:8px;background:#fff;border-radius:14px;padding:6px;max-width:560px}
.sr input{flex:1;border:0;outline:0;margin:0;padding:8px;color:#12263f;background:transparent;min-width:0}
h2{margin:22px 0 10px;font-size:1.2rem}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.g2{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.cat{text-align:center;cursor:pointer;font-weight:600;font-size:.9rem}.cat:hover{border-color:var(--pr)}.cat span{display:block;font-size:1.7rem}
.tag{display:inline-block;background:var(--wa);color:var(--pr);border-radius:8px;padding:2px 8px;font-size:.75rem}
.pr{color:var(--ac);font-weight:800}.mu{color:var(--mu);font-size:.85rem}.ok{color:var(--ac)}.bad{color:#d64545}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:8px;text-align:start;border-bottom:1px solid var(--bd)}.sc{overflow-x:auto}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
input[type=radio],input[type=checkbox]{width:auto;margin:0;flex:none;accent-color:var(--ac);transform:scale(1.2)}.opt{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}
.st{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}.st b{font-size:1.5rem;color:var(--pr);display:block}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}
.dt{display:flex;gap:6px;overflow-x:auto;margin:6px 0 14px;padding-bottom:4px;scrollbar-width:thin}.dt button{flex:0 0 auto;white-space:nowrap}
.al{list-style:none;margin:0;padding:0}.al li{display:flex;gap:10px;padding:9px 4px;border-bottom:1px solid var(--bd);align-items:flex-start}.al li:last-child{border:0}.al i{font-style:normal;font-size:1.1rem}.al small{display:block;color:var(--mu);font-size:.75rem}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.tb input,.tb select{flex:1;min-width:140px;margin:0}
.acts{display:flex;gap:4px;flex-wrap:wrap}.st .c.w{border:1px solid #d64545}.st .c.w b{color:#d64545}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#m .b{background:var(--card);border-radius:18px;padding:20px;max-width:420px;width:100%;max-height:90vh;overflow:auto}

const TERMS=[
["قبول الشروط","باستخدامك «سوق السودان للتقنية والاتصالات» (المنصة) أو إنشاء حساب فيها أو تصفّحها، فإنك تقرّ بأنك قرأت هذه الشروط والأحكام وتوافق عليها. إذا لم توافق عليها فيرجى التوقف عن استخدام المنصة.\nالمنصة موجّهة للأفراد والشركات الذين تبلغ أعمارهم 18 عاماً فأكثر أو يمثّلون جهة قانونية.","Acceptance of terms","By browsing the Sudan ICT Marketplace (the Platform), creating an account or using any of its services, you confirm that you have read and agree to these Terms & Conditions. If you do not agree, please stop using the Platform.\nThe Platform is intended for individuals aged 18 or over and for legal entities."],
["دور المنصة","المنصة سوق إلكتروني يربط العملاء بشركات تقنية المعلومات والاتصالات في السودان. المنصة ليست البائع ولا مقدّم الخدمة، وتتم المعاملات بين العميل والشركة مباشرة. لا تضمن المنصة جودة المنتجات أو الخدمات المعروضة، لكنها تراجع الشركات قبل اعتمادها.","Role of the Platform","The Platform is an online marketplace that connects customers with ICT and telecom companies in Sudan. The Platform is not the seller or service provider; transactions take place directly between the customer and the company. The Platform does not guarantee the quality of listed products or services, but it reviews companies before approving them."],
["الحسابات والتسجيل","• يجب أن تكون بيانات التسجيل صحيحة وكاملة ومحدّثة.\n• يتم التحقق من الحساب برمز يُرسل إلى رقم الجوال أو البريد الإلكتروني.\n• أنت مسؤول عن كل نشاط يتم من خلال حسابك، وعليك إبلاغنا فوراً عند أي استخدام غير مصرّح به.\n• الحسابات نوعان: عميل (للشراء وطلب الأسعار والتقييم) وشركة (لعرض المنتجات والخدمات).","Accounts & registration","• Registration details must be accurate, complete and up to date.\n• Accounts are verified with a code sent to your mobile number or email.\n• You are responsible for all activity under your account and must tell us immediately of any unauthorised use.\n• There are two account types: client (to buy, request quotes and rate) and company (to list products and services)."],
["اعتماد الشركات","لا تظهر منتجات الشركة للعملاء إلا بعد اعتماد حسابها. يشترط لذلك:\n• تسجيل رسمي للشركة.\n• رفع شهادة تسجيل الشركة.\n• اعتماد موقع الشركة من الجهات الحكومية المختصة.\nيحق للمنصة رفض أو إيقاف أي شركة لا تستوفي هذه الشروط أو يثبت تقديمها معلومات مضلِّلة، وقد تطلب مستندات إضافية في أي وقت.","Company approval","A company's listings become visible to customers only after its account is approved. This requires:\n• Official company registration.\n• Upload of the company registration certificate.\n• Approval of the company's location by the competent government authorities.\nThe Platform may reject or suspend any company that does not meet these requirements or that provides misleading information, and may request additional documents at any time."],
["المنتجات والأسعار","• تحدّد كل شركة منتجاتها وأسعارها ووصفها، وهي المسؤولة عن دقتها.\n• تُعرض الأسعار بالجنيه السوداني، وقد تتغير دون إشعار مسبق.\n• عرض المنتج في المنصة دعوة للتعاقد وليس عرضاً ملزماً، ولا يكتمل البيع إلا بتأكيد الشركة للطلب.\n• قد تختلف الصور والأوصاف التوضيحية عن المنتج الفعلي.","Listings & prices","• Each company sets and is responsible for the accuracy of its products, prices and descriptions.\n• Prices are shown in Sudanese pounds (SDG) and may change without notice.\n• A listing is an invitation to deal, not a binding offer; a sale is complete only when the company confirms the order.\n• Illustrative images and descriptions may differ from the actual product."],
["الطلبات والدفع والتوصيل","• عند تقديم طلب يصل إلى الشركة المعنية، وتتولى الشركة التواصل معك لتأكيده.\n• يتم الدفع وفق الطريقة المتفق عليها مع الشركة (تحويل بنكي، نقود موبايل، بطاقة، أو الدفع عند الاستلام) وبالتنسيق معها بعد تأكيد الطلب.\n• رسوم التوصيل وأوقاته كما تُعرض عند إتمام الطلب، وقد تتأثر بالظروف المحلية.\n• لا تستلم المنصة مدفوعاتك ولا تتحمل مسؤولية تحويلها خارج الاتفاق مع الشركة. تحقّق دائماً من هوية الطرف الذي تدفع له.","Orders, payment & delivery","• When you place an order it is sent to the relevant company, which will contact you to confirm it.\n• Payment is made by the method agreed with the company (bank transfer, mobile money, card or cash on delivery), arranged with them after the order is confirmed.\n• Delivery fees and times are as shown at checkout and may be affected by local conditions.\n• The Platform does not receive your payments and is not responsible for transfers made outside the agreement with the company. Always verify who you are paying."],
["الضمان والإرجاع","سياسات الضمان والاستبدال والإرجاع تحدّدها كل شركة، ويجب عليها توضيحها للعميل قبل البيع. عند حدوث خلاف يُرجى التواصل مع الشركة أولاً، ويمكنك إبلاغ إدارة المنصة التي قد تتوسط بين الطرفين دون التزام بحل النزاع.","Warranty & returns","Warranty, exchange and return policies are set by each company, which must make them clear before the sale. If a dispute arises, please contact the company first; you may also report it to the Platform, which may mediate between the parties without any obligation to resolve the dispute."],
["التقييمات والمحتوى","• يمكن لحسابات العملاء فقط تقييم الشركات والمنتجات والخدمات، بتقييم واحد لكل عنصر يمكن تعديله لاحقاً.\n• يجب أن يعكس التقييم تجربة حقيقية وأن يخلو من الإساءة والسبّ والإعلانات والمعلومات الشخصية للآخرين.\n• يحق للمنصة حذف أي تقييم أو محتوى مخالف أو مشبوه دون إشعار.\n• يُمنع على الشركات تقييم نفسها أو دفع مقابل تقييمات إيجابية أو الإساءة لمنافسيها.","Reviews & content","• Only client accounts may rate companies, products and services, with one rating per item that can be edited later.\n• A rating must reflect a genuine experience and must not contain abuse, insults, advertising or other people's personal information.\n• The Platform may remove any violating or suspicious review or content without notice.\n• Companies must not rate themselves, pay for positive reviews, or disparage competitors."],
["السلوك المحظور","يُمنع على جميع المستخدمين:\n• الاحتيال أو انتحال هوية شخص أو جهة.\n• عرض منتجات مقلّدة أو مسروقة أو مخالفة للقانون.\n• رفع محتوى ضارّ أو برمجيات خبيثة أو محاولة اختراق المنصة أو تعطيلها.\n• جمع بيانات المستخدمين أو استخراج محتوى المنصة بصورة آلية دون إذن.\n• استخدام المنصة لأي غرض مخالف للقوانين المعمول بها في السودان.","Prohibited conduct","All users must not:\n• Commit fraud or impersonate any person or organisation.\n• List counterfeit, stolen or unlawful goods.\n• Upload harmful content or malware, or try to hack or disrupt the Platform.\n• Collect user data or scrape Platform content automatically without permission.\n• Use the Platform for any purpose that breaches the laws in force in Sudan."],
["الخصوصية وبيانات الاتصال","• نجمع البيانات اللازمة لتشغيل الخدمة: الاسم ورقم الجوال أو البريد الإلكتروني والطلبات وطلبات عروض الأسعار والتقييمات، وللشركات شهادة التسجيل وبيانات الملف التعريفي.\n• تُشارك بيانات الطلب والتواصل مع الشركة المعنية بالطلب فقط بالقدر اللازم لتنفيذه.\n• لا نبيع بياناتك لأطراف ثالثة. وتُستخدم شهادات تسجيل الشركات للتحقق فقط.\n• يمكنك طلب تصحيح بياناتك أو حذف حسابك بالتواصل معنا.","Privacy & contact data","• We collect the data needed to run the service: name, mobile number or email, orders, quote requests and ratings; and, for companies, the registration certificate and profile details.\n• Order and contact details are shared only with the company involved in the order, to the extent needed to fulfil it.\n• We do not sell your data to third parties. Company registration certificates are used for verification only.\n• You may ask us to correct your data or delete your account by contacting us."],
["الملكية الفكرية","اسم المنصة وشعارها وتصميمها ملك للمنصة ولا يجوز استخدامها دون إذن كتابي. تبقى ملكية محتوى الشركات (النصوص والصور والشعارات) لأصحابها، وتمنح كل شركة المنصة ترخيصاً غير حصري لعرض هذا المحتوى وتسويقه داخل المنصة، وتتعهد بأن لديها الحق في استخدامه.","Intellectual property","The Platform's name, logo and design belong to the Platform and may not be used without written permission. Company content (texts, images, logos) remains the property of its owners; each company grants the Platform a non-exclusive licence to display and promote it on the Platform and warrants that it has the right to use it."],
["حدود المسؤولية","تُقدَّم المنصة «كما هي» دون ضمانات صريحة أو ضمنية. وبالقدر الذي يسمح به القانون، لا تتحمل المنصة مسؤولية: جودة المنتجات أو الخدمات أو التأخر في التسليم، أو الخلافات بين العملاء والشركات، أو أي خسائر ناتجة عن الاعتماد على معلومات الشركات، أو انقطاع الخدمة أو الأعطال الفنية أو الظروف خارجة عن إرادتنا.","Limitation of liability","The Platform is provided “as is” without express or implied warranties. To the extent permitted by law, the Platform is not liable for: the quality of products or services or late delivery; disputes between customers and companies; losses arising from reliance on company information; or service interruptions, technical faults or events beyond our control."],
["الإيقاف وإنهاء الحساب","يحق للمنصة تعليق أي حساب أو إنهاءه عند مخالفة هذه الشروط أو الاشتباه في نشاط احتيالي أو مضر. ويمكنك التوقف عن استخدام المنصة وطلب إغلاق حسابك في أي وقت.","Suspension & termination","The Platform may suspend or terminate any account for breach of these terms or for suspected fraudulent or harmful activity. You may stop using the Platform and ask to close your account at any time."],
["تعديل الشروط","قد نعدّل هذه الشروط من وقت لآخر، وتُنشر النسخة المحدّثة في هذه الصفحة مع تاريخ التحديث. استمرارك في استخدام المنصة بعد النشر يعني موافقتك على الشروط المعدَّلة.","Changes to these terms","We may update these terms from time to time. The updated version will be published on this page with its date. Continuing to use the Platform after publication means you accept the updated terms."],
["القانون الواجب التطبيق","تخضع هذه الشروط وتُفسَّر وفق القوانين المعمول بها في جمهورية السودان، ويُسعى أولاً إلى تسوية أي نزاع بالتراضي قبل اللجوء إلى الجهات المختصة.","Governing law","These terms are governed by and interpreted under the laws in force in the Republic of Sudan. The parties will first try to settle any dispute amicably before turning to the competent authorities."]];
const PRIVACY_DATE=["8 نوفمبر 2026","8 November 2026"];
const PRIVACY=[
["من نحن","«سوق السودان للتقنية والاتصالات» (المنصة) سوق إلكتروني يربط العملاء بشركات التقنية والاتصالات في السودان، ويعمل عبر الموقع sictm.net وتطبيق الجوال SICTM. توضّح هذه السياسة البيانات التي نجمعها وكيف نستخدمها ونحميها، والخيارات المتاحة لك.","Who we are","Sudan ICT Marketplace (the Platform) is an online marketplace connecting customers with ICT and telecom companies in Sudan, available on the website sictm.net and the SICTM mobile app. This policy explains what data we collect, how we use and protect it, and the choices you have."],
["البيانات التي نجمعها","• بيانات الحساب: الاسم، رقم الجوال أو البريد الإلكتروني، ونوع الحساب (عميل أو شركة).\n• بيانات الشركات: اسم الشركة، المدينة، الهاتف، رقم واتساب، النبذة، شهادة تسجيل الشركة، والمنتجات والخدمات المعروضة.\n• الطلبات: المنتجات المطلوبة، واسم المستلم ورقم هاتفه وعنوانه، وطريقة التوصيل والدفع المختارة.\n• طلبات عروض الأسعار: نص الرسالة وبيانات التواصل.\n• التقييمات: عدد النجوم والتعليق واسم صاحب التقييم.\n• سجل النشاط: العمليات التي تتم على المنصة (مثل التسجيل والدخول وإضافة المنتجات وتغيير حالة الطلبات) مع وقتها، لأغراض الأمان والإدارة.\n• على جهازك فقط: اللغة والمظهر والسلة والمفضلة وقائمة المقارنة تُحفظ في متصفحك ولا تُرسل إلينا.","Data we collect","• Account data: name, mobile number or email, and account type (customer or company).\n• Company data: company name, city, phone, WhatsApp number, description, registration certificate, and the products and services listed.\n• Orders: items ordered, the recipient's name, phone number and address, and the delivery and payment method chosen.\n• Quote requests: the message and contact details.\n• Reviews: star rating, comment and the reviewer's name.\n• Activity log: actions taken on the Platform (such as sign-up, sign-in, adding listings and changing order status) with their time, for security and administration.\n• On your device only: language, theme, cart, favourites and comparison list are stored in your browser and are not sent to us."],
["كيف نستخدم البيانات","• لإنشاء حسابك والتحقق منه وتسجيل دخولك.\n• لعرض الشركات والمنتجات والخدمات والتقييمات.\n• لإيصال طلباتك وطلبات عروض الأسعار إلى الشركة المعنية لتتواصل معك.\n• لمراجعة الشركات واعتمادها، ومنع الاحتيال وإساءة الاستخدام.\n• لإدارة المنصة وتحسينها والرد على استفساراتك.\nلا نبيع بياناتك، ولا نستخدمها للإعلانات، ولا نستخدم أدوات تتبّع إعلانية.","How we use data","• To create and verify your account and sign you in.\n• To display companies, products, services and reviews.\n• To pass your orders and quote requests to the company involved so it can contact you.\n• To review and approve companies, and to prevent fraud and misuse.\n• To run and improve the Platform and answer your questions.\nWe do not sell your data, use it for advertising, or use advertising trackers."],
["مع من نشارك البيانات","• الشركة المعنية: عند إرسال طلب أو طلب عرض سعر تُشارك بياناتك فيه (الاسم والهاتف والعنوان والرسالة) مع تلك الشركة فقط.\n• العامة: ملفات الشركات المعتمدة ومنتجاتها وخدماتها والتقييمات (مع اسم صاحب التقييم) ظاهرة لجميع الزوار.\n• مقدّمو الخدمات التقنية: Google Firebase (تسجيل الدخول، قاعدة البيانات، تخزين الملفات، والتحقق برمز SMS مع Google reCAPTCHA)، وNetlify (استضافة الموقع، وقد تحتفظ بسجلات تقنية مثل عنوان IP)، وGoogle Fonts (الخطوط). يعالج هؤلاء البيانات نيابة عنا وفق سياساتهم.\n• واتساب: عند الضغط على زر «اسأل عن السعر عبر واتساب» تنتقل إلى تطبيق واتساب (Meta) وتخضع المحادثة لسياسة واتساب.\n• الجهات الرسمية: إذا طُلب ذلك بموجب القانون.","Who we share data with","• The company involved: when you send an order or quote request, its details (name, phone, address, message) are shared with that company only.\n• The public: approved company profiles, their products and services, and reviews (with the reviewer's name) are visible to all visitors.\n• Technical service providers: Google Firebase (sign-in, database, file storage, and SMS verification with Google reCAPTCHA), Netlify (website hosting; may keep technical logs such as IP address) and Google Fonts (fonts). They process data on our behalf under their own policies.\n• WhatsApp: tapping \"Ask price on WhatsApp\" opens WhatsApp (Meta), and that conversation is governed by WhatsApp's policy.\n• Authorities: where required by law."],
["تطبيق الجوال","تطبيق SICTM على أندرويد يعرض الموقع sictm.net نفسه، ويجمع البيانات نفسها الموضحة هنا فقط. لا يصل التطبيق إلى جهات الاتصال أو الموقع الجغرافي أو الكاميرا أو الميكروفون أو الصور، ولا يحتوي على إعلانات. قد يحفظ نسخة من الموقع على جهازك ليعمل دون اتصال.","Mobile app","The SICTM Android app shows the same sictm.net website and collects only the data described here. It does not access your contacts, location, camera, microphone or photos, and contains no ads. It may keep a copy of the site on your device so it can open offline."],
["التخزين والحماية","تُحفظ البيانات على خوادم Google Firebase وقد تكون خارج السودان. تُنقل البيانات عبر اتصال مشفّر (HTTPS)، ولا يستطيع الوصول إلى الطلبات وطلبات الأسعار إلا العميل والشركة المعنية وإدارة المنصة، وفق قواعد صلاحيات محددة. لا يوجد نظام آمن تماماً، لكننا نتخذ إجراءات معقولة لحماية بياناتك.","Storage & security","Data is stored on Google Firebase servers, which may be outside Sudan. Data travels over an encrypted connection (HTTPS), and only the customer, the company involved and Platform administrators can access orders and quote requests, enforced by access rules. No system is completely secure, but we take reasonable steps to protect your data."],
["مدة الاحتفاظ","نحتفظ ببيانات حسابك ما دام الحساب قائماً. عند حذف الحساب نحذف بيانات الحساب والملف التعريفي وقوائم الشركة خلال 30 يوماً، وقد نحتفظ بسجلات الطلبات وسجل النشاط مدة أطول إذا لزم ذلك لأغراض قانونية أو لحل النزاعات أو منع الاحتيال.","Data retention","We keep your account data while your account exists. When an account is deleted we remove the account, profile and company listings within 30 days; we may keep order records and the activity log longer where needed for legal reasons, dispute resolution or fraud prevention."],
["حقوقك وحذف الحساب","يمكنك في أي وقت طلب نسخة من بياناتك أو تصحيحها أو حذف حسابك وبياناته. لطلب حذف الحساب أرسل رسالة من الرقم أو البريد المسجّل إلى بريدنا أدناه بعنوان «حذف الحساب»، وسننفّذ الطلب خلال 30 يوماً. يمكنك أيضاً تعديل اسمك وبيانات شركتك مباشرة من لوحة التحكم.","Your rights & account deletion","At any time you can ask for a copy of your data, correct it, or delete your account and its data. To delete your account, send a message from your registered number or email to the address below with the subject \"Delete account\"; we will complete it within 30 days. You can also edit your name and company details directly from your dashboard."],
["الأطفال","المنصة غير موجهة لمن هم دون 18 عاماً، ولا نجمع بياناتهم عن قصد. إذا علمت أن طفلاً أنشأ حساباً فتواصل معنا لحذفه.","Children","The Platform is not intended for anyone under 18, and we do not knowingly collect their data. If you learn that a child has created an account, contact us and we will delete it."],
["تغييرات هذه السياسة","قد نحدّث هذه السياسة من وقت لآخر، وتُنشر النسخة المحدثة في هذه الصفحة مع تاريخها.","Changes to this policy","We may update this policy from time to time. The updated version will be published on this page with its date."]];
function privacyPage(){return `<div class="tm"><div class="thd"><img src="${IMG.f}" alt="Sudan ICT Marketplace"></div><div class="row"><h2 style="margin:0">${L("سياسة الخصوصية","Privacy Policy")}</h2><button class="btn s sm noprint" onclick="document.querySelectorAll('.tm details').forEach(d=>d.open=true);print()">🖨️ ${L("طباعة","Print")}</button></div><p class="mu">${L("آخر تحديث: ","Last updated: ")}${L(PRIVACY_DATE[0],PRIVACY_DATE[1])}</p>${PRIVACY.map((s,i)=>`<details ${i<2?"open":""}><summary>${i+1}. ${L(s[0],s[2])}</summary><div class="tb">${esc(L(s[1],s[3]))}</div></details>`).join("")}<div class="c" style="margin-top:14px"><b>${L("للتواصل وطلبات البيانات","Contact & data requests")}</b><div class="mu">${L("للاستفسار عن الخصوصية أو طلب نسخة من بياناتك أو تصحيحها أو حذف حسابك:","For privacy questions, or to request a copy, correction or deletion of your data or account:")} <a dir="ltr" style="color:var(--pr)" href="mailto:${esc(SITE_EMAIL)}?subject=${encodeURIComponent("Delete account / حذف الحساب")}">${esc(SITE_EMAIL)}</a></div></div><div style="text-align:center;margin-top:16px" class="noprint"><button class="btn s" onclick="go('terms')">${L("الشروط والأحكام","Terms & Conditions")}</button> <button class="btn" onclick="go('home')">${L("العودة للرئيسية","Back to home")}</button></div></div>`}
function termsPage(){return `<div class="tm"><div class="thd"><img src="${IMG.f}" alt="Sudan ICT Marketplace"></div><div class="row"><h2 style="margin:0">${L("الشروط والأحكام","Terms & Conditions")}</h2><button class="btn s sm noprint" onclick="document.querySelectorAll('.tm details').forEach(d=>d.open=true);print()">🖨️ ${L("طباعة","Print")}</button></div><p class="mu">${L("آخر تحديث: ","Last updated: ")}${L(TERMS_DATE[0],TERMS_DATE[1])}</p>${TERMS.map((s,i)=>`<details ${i===0?"open":""}><summary>${i+1}. ${L(s[0],s[2])}</summary><div class="tb">${esc(L(s[1],s[3]))}</div></details>`).join("")}<div class="c" style="margin-top:14px"><b>${L("للتواصل والاستفسارات","Contact us")}</b><div class="mu">${L("لأي استفسار حول هذه الشروط أو طلبات تصحيح البيانات وحذف الحساب:","For questions about these terms, or requests to correct data or delete an account:")} <span dir="ltr">${esc(SITE_EMAIL)}</span></div></div><div style="text-align:center;margin-top:16px" class="noprint"><button class="btn" onclick="go('home')">${L("العودة للرئيسية","Back to home")}</button></div></div>`}
function render(){hdr();const v=$("v");let h="";
if(view==="home"){const ac=db.cos.filter(c=>c.approved),ap=db.products.filter(vis);
h=`<div class="hero"><img class="hl" src="${IMG.f}" alt="Sudan ICT Marketplace"><h1>${L("التقنية أقرب إليك .. من السودان","Technology closer to you .. from Sudan")}</h1><p>${L("أجهزة، شبكات، سيرفرات، سحابة وأمن سيبراني من شركات سودانية موثوقة.","Hardware, networks, servers, cloud and cybersecurity from trusted Sudanese companies.")}</p><div class="sr"><input id="q" autocomplete="off" placeholder="${L("ابحث عن منتج أو خدمة أو شركة...","Search products, services or companies...")}" oninput="sug(this.value)" onkeydown="if(event.key==='Enter')go('products',this.value)"><button class="btn" onclick="go('products',$('q').value)">${L("بحث","Search")}</button><div class="sg" id="sg"></div></div><div class="chips" style="margin-top:14px">${["Cisco","Dell","HP","Ubiquiti",L("راوتر","Router"),L("كاميرات","Cameras"),"UPS",L("سيرفر","Server"),L("سويتش","Switch"),L("لابتوب","Laptop"),L("طابعة","Printer"),L("شبكات","Network")].filter(x=>{const q=x.toLowerCase();return ap.some(p=>(p.name+(p.nameEn||"")+p.desc+(p.descEn||"")+nm(co(p.cid))).toLowerCase().includes(q))}).slice(0,6).map(x=>`<span class="chip" onclick="go('products','${x}')">${x}</span>`).join("")}</div></div>
<div class="band"><div><b data-n="${ac.length}">${ac.length}</b><span>${L("شركة موثّقة","Verified companies")}</span></div><div><b data-n="${ap.length}">${ap.length}</b><span>${L("منتج وخدمة","Products & services")}</span></div><div><b data-n="${cities().length}">${cities().length}</b><span>${L("مدينة","Cities")}</span></div><div><b data-n="${(db.rev||[]).length}">${(db.rev||[]).length}</b><span>${L("تقييم عملاء","Customer reviews")}</span></div></div>

const MAXI=4;let PI=[];
async function shrinkImg(file){const st=FB&&FB.st,max=st?1200:FB?700:800,q=st?.8:FB?.65:.72;let bmp;

const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(bmp,0,0,cv.width,cv.height);

function appr(id){const c=co(id);put("cos",{...c,approved:!c.approved});logA("approve",`${c.approved?"إيقاف":"اعتماد"} الشركة: ${c.name}`,`${c.approved?"Suspended":"Approved"} company: ${c.nameEn||c.name}`,id);render()}
function hideP(id){const p=pd_(id);put("products",{...p,hidden:!p.hidden});logA("product",`${p.hidden?"إظهار":"إخفاء"}: ${p.name}`,`${p.hidden?"Unhid":"Hid"}: ${p.nameEn||p.name}`,p.cid);render()}
function delX(col,id){if(!confirm(L("حذف نهائياً؟","Delete permanently?")))return;del(col,id);render()}
function coForm(id){const c=co(id),f=(k,lb,ltr)=>`<div><label>${lb}</label><input id="cf_${k}" ${ltr?'dir="ltr"':""} value="${esc(c[k]||"")}"></div>`;
md(`<div class="row"><h3 style="margin:0">✏️ ${esc(nm(c))}</h3><button class="btn s sm" onclick="cm()">✕</button></div><div class="g2">${f("name",L("الاسم (عربي)","Name (Arabic)"))}${f("nameEn","Name (English)")}${f("city",L("المدينة (عربي)","City (Arabic)"))}${f("cityEn","City (English)")}${f("phone",L("الهاتف","Phone"),1)}${f("wa",L("واتساب","WhatsApp"),1)}</div><label>${L("نبذة (عربي)","About (Arabic)")}</label><textarea id="cf_about" rows="2">${esc(c.about||"")}</textarea><label>About (English)</label><textarea id="cf_aboutEn" rows="2">${esc(c.aboutEn||"")}</textarea><label class="opt"><input type="checkbox" id="cf_ok" ${c.approved?"checked":""}> ${L("الشركة معتمدة (منتجاتها ظاهرة للعملاء)","Company approved (listings visible to customers)")}</label><p class="mu">${L("الشهادة:","Certificate:")} ${certL(c)}</p><button class="btn" onclick="saveCoA('${id}')">${L("حفظ","Save")}</button>`);$("mb").classList.add("wide")}
function saveCoA(id){const c=co(id),n={...c};["name","nameEn","city","cityEn","phone","wa","about","aboutEn"].forEach(k=>n[k]=$("cf_"+k).value.trim());n.name=n.name||c.name;n.approved=$("cf_ok").checked;put("cos",n);logA("profile",`تعديل بيانات الشركة من الإدارة: ${n.name}`,`Company details edited by admin: ${n.nameEn||n.name}`,id);cm();toast(L("تم الحفظ","Saved"));render()}
function delCo(id){const c=co(id),ps=db.products.filter(p=>p.cid===id);if(!confirm(L(`حذف الشركة «${c.name}» و${ps.length} من منتجاتها وخدماتها نهائياً؟`,`Delete company "${nm(c)}" and its ${ps.length} listings permanently?`)))return;ps.forEach(p=>del("products",p.id));del("cos",id);logA("approve",`حذف الشركة: ${c.name}`,`Deleted company: ${c.nameEn||c.name}`,"");render()}
function susp(id){const u=db.users.find(x=>x.id===id);if(!u||id===me.id)return;const on=!u.suspended;put("users",{...u,suspended:on});
if(on&&u.role==="company"&&db.cos.some(c=>c.id===id))put("cos",{...co(id),approved:false});logA("user",`${on?"إيقاف":"تفعيل"} المستخدم: ${u.name}`,`${on?"Suspended":"Reactivated"} user: ${u.name}`,u.role==="company"?id:"");render()}
function delU(id){const u=db.users.find(x=>x.id===id);if(!u||id===me.id)return;const isC=db.cos.some(c=>c.id===id);
if(!confirm(L(`حذف المستخدم «${u.name}» نهائياً؟${isC?" سيتم حذف شركته ومنتجاتها أيضاً.":""}`,`Delete user "${u.name}" permanently?${isC?" Their company and listings will be deleted too.":""}`)))return;
if(isC){db.products.filter(p=>p.cid===id).forEach(p=>del("products",p.id));del("cos",id)}if(FB&&db.adm.some(a=>a.id===id))del("adm",id);del("users",id);logA("user",`حذف المستخدم: ${u.name}`,`Deleted user: ${u.name}`,"");render()}
function mkAdm(id,on){if(id===me.id)return toast(L("لا يمكنك تغيير صلاحياتك بنفسك","You cannot change your own access"));const u=db.users.find(x=>x.id===id)||(db.adm||[]).find(x=>x.id===id)||{id,name:id};
if(!on&&!confirm(L(`إلغاء صلاحية الإشراف عن «${u.name}»؟`,`Remove admin access from "${u.name}"?`)))return;
if(FB){if(on)put("adm",{id,name:u.name||"",contact:u.contact||"",at:new Date().toISOString()});else del("adm",id)}
else{const n={...u,role:on?"admin":(u.prevRole||"client")};if(on)n.prevRole=u.role;else delete n.prevRole;put("users",n)}
logA("admin",`${on?"منح":"إلغاء"} صلاحية الإشراف: ${u.name}`,`${on?"Granted":"Removed"} admin access: ${u.name}`,"");toast(L("تم التحديث","Updated"));render()}
function addAdm(){const n=$("adn").value.trim(),c=$("adc").value.trim().replace(/\s/g,""),em=/^\S+@\S+\.\S+$/.test(c);
if(!em&&!(FB?/^\+\d{9,15}$/:/^\+?\d{9,15}$/).test(c))return toast(L("أدخل بريداً صحيحاً أو رقم جوال بصيغة دولية +249...","Enter a valid email or a mobile number in international format +249..."));
const k=c.toLowerCase(),u=db.users.find(x=>String(x.contact||"").toLowerCase()===k);
if(u){if(isAdm(u))return toast(L("هذا المستخدم مشرف بالفعل","This user is already an admin"));mkAdm(u.id,true);return}
if(FB){put("inv",{id:k,name:n||c,contact:c,by:me.id,at:new Date().toISOString()});toast(L("تم حفظ الدعوة. سيصبح مشرفاً عند أول دخول بهذا البريد أو الرقم.","Invite saved. They become admin the first time they sign in with this email or number."))}
else{put("users",{id:uid("u"),contact:c,role:"admin",name:n||c});toast(L("تم إنشاء حساب المشرف. يمكنه الدخول الآن بهذا البريد أو الرقم.","Admin account created. They can sign in now with this email or number."))}
logA("admin",`إنشاء مستخدم مشرف: ${n||c}`,`Created admin user: ${n||c}`,"");render()}
