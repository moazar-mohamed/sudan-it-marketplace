<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1565C0" />
    <meta name="description" content="سوق السودان للتقنية - منتجات وشركات وفنيون في مدينتك" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>سوق السودان للتقنية</title>
    <script>
      // Before the first paint, so a dark page never flashes light (see src/theme.tsx).
      try {
        var t = localStorage.getItem('sudan-it-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
