<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Old addresses open the same page on the new domain.
      (function () {
        var h = location.hostname;
        if (h === 'sudan-it-market.web.app' || h === 'sudan-it-market.firebaseapp.com') {
          location.replace('https://sictm.net' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#063B73" />
    <meta name="description" content="SICTM سوق السودان للتقنية: حواسيب وشبكات وكاميرات مراقبة وUPS وخدمات تقنية من شركات في السودان. اطلب مباشرة وتواصل مع الشركة في مدينتك." />
    <!-- The card WhatsApp, Facebook and X show when sictm.net is shared (the catalog pages carry their own). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="سوق السودان للتقنية" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="سوق السودان للتقنية | Sudan ICT Marketplace" />
    <meta property="og:description" content="منتجات وشركات وفنيون في مدينتك: حواسيب، شبكات، كاميرات، طابعات وخدمات تقنية. اطلب مباشرة وتواصل مع الشركة." />
    <meta property="og:url" content="https://sictm.net/" />
    <meta property="og:image" content="https://sictm.net/og-logo.png" />
    <meta property="og:image:width" content="432" />
    <meta property="og:image:height" content="432" />
    <meta property="og:image:alt" content="سوق السودان للتقنية" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="سوق السودان للتقنية | Sudan ICT Marketplace" />
    <meta name="twitter:description" content="منتجات وشركات وفنيون في مدينتك. اطلب مباشرة وتواصل مع الشركة." />
    <meta name="twitter:image" content="https://sictm.net/og-logo.png" />
    <!-- Tells Google the site's name (SICTM) and its Arabic name. -->
    <script type="application/ld+json">
      [{"@context":"https://schema.org","@type":"WebSite","name":"SICTM","alternateName":["سوق السودان للتقنية","sictm.net"],"url":"https://sictm.net/","inLanguage":"ar"},
       {"@context":"https://schema.org","@type":"Organization","name":"SICTM","alternateName":"سوق السودان للتقنية","url":"https://sictm.net/","logo":"https://sictm.net/icon-512.png"}]
    </script>
    <link rel="icon" type="image/png" href="/favicon-mark.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- Added to an iPhone's Home Screen, the site opens on its own and can receive notifications. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="سوق التقنية" />
    <title>سوق السودان للتقنية | SICTM</title>
    <script>
      // Before the first paint, so a dark page never flashes light (see src/theme.tsx).
      try {
        if (localStorage.getItem('language') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
        var t = localStorage.getItem('sudan-it-theme');
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
